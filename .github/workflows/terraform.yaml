name: Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} - ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    steps:

      # Checkout terraform-infrastructure
      - name: Checkout
        uses: actions/checkout@v5

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Create GitHub App installation token
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Dhruv9066
          repositories: terraform-aws-s3-bucket-website
          permission-contents: read

      # Check repositories accessible to GitHub App
      - name: Check App installation access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Repositories accessible to GitHub App:"
          gh api /installation/repositories \
            --jq '.repositories[] | "\(.full_name) | contents=\(.permissions.contents)"'

      # Configure Git to use GitHub App token
      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # Verify private module access
      - name: Verify private module access
        run: |
          git ls-remote \
            https://github.com/Dhruv9066/terraform-aws-s3-bucket-website.git

      # Terraform Init
      - name: Terraform Init
        run: terraform init

      # Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -var-file=${{ inputs.environment }}.tfvars

      # Terraform Apply
      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve -var-file=${{ inputs.environment }}.tfvars