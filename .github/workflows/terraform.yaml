name: Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} - ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    steps:

      # ---------------------------------------------------------
      # Checkout terraform-infrastructure
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ---------------------------------------------------------
      # Setup Terraform
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------------------
      # Create GitHub App installation token
      # ---------------------------------------------------------
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Dhruv9066
          repositories: terraform-aws-s3-bucket-website
          permission-contents: read

      # ---------------------------------------------------------
      # Debug 1: Show installation ID
      # ---------------------------------------------------------
      - name: Debug - GitHub App installation ID
        run: |
          echo "GitHub App installation ID:"
          echo "${{ steps.app-token.outputs.installation-id }}"

      # ---------------------------------------------------------
      # Debug 2: Check repositories accessible to App
      # ---------------------------------------------------------
      - name: Debug - App installation repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Repositories accessible to GitHub App:"

          gh api /installation/repositories \
            --jq '.repositories[] | "\(.full_name)"'

      # ---------------------------------------------------------
      # Debug 3: Check private repository API access
      # ---------------------------------------------------------
      - name: Debug - Check private repository API access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Checking private repository API access..."

          gh api \
            repos/Dhruv9066/terraform-aws-s3-bucket-website \
            --jq '{
              name: .full_name,
              private: .private
            }'

      # ---------------------------------------------------------
      # Debug 4: Check repository Contents API
      # This directly tests Contents read access.
      # ---------------------------------------------------------
      - name: Debug - Check repository contents access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Checking repository contents access..."

          gh api \
            repos/Dhruv9066/terraform-aws-s3-bucket-website/contents \
            --jq '.[].name'

      # ---------------------------------------------------------
      # Debug 5: Test Git access directly with App token
      # ---------------------------------------------------------
      - name: Debug - Verify private module Git access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Testing Git access to private module..."

          git \
            -c "http.https://github.com/.extraheader=Authorization: Bearer ${GH_TOKEN}" \
            ls-remote \
            https://github.com/Dhruv9066/terraform-aws-s3-bucket-website.git

          echo "Private module Git access successful."

      # ---------------------------------------------------------
      # Terraform Init
      # ---------------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # ---------------------------------------------------------
      # Terraform Validate
      # ---------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # ---------------------------------------------------------
      # Terraform Plan
      # ---------------------------------------------------------
      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -var-file=${{ inputs.environment }}.tfvars

      # ---------------------------------------------------------
      # Terraform Apply
      # ---------------------------------------------------------
      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve -var-file=${{ inputs.environment }}.tfvars